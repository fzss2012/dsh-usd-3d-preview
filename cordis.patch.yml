# dsh-usd-3d-preview — USD / 3D preview in the document panel (bundle patch layer)
#
# This file is the bundle's only patch entry (package.json `dsh.bundle.patch`).
# `- insert:` appends one loader entry to the profile's root composition:
#
#   ui-usd-3d-preview → package dsh-usd-3d-preview
#
# That entry does two things:
#   (1) it loads the host half `lib/index.js`, which serves the asset, health and
#       local-update routes through the Connection service (see below); it is also
#       what lets client-modules discover
#       `dsh.client` in package.json and serve `lib/client.js` as a browser module;
#   (2) the browser half registers a `documentPreviews` implementation, the keyed
#       `sidebar.right.tab.document` body, and the local-update panel in Settings →
#       Plugins and on this bundle's Plugins detail page.
#
# Parsing and composition both happen in the browser:
#   · primary engine = @huggingface/usd-web-viewer (pure-Rust openusd compiled to
#     WebAssembly, composition in a Web Worker, MIT). Referenced layers are read
#     back through the workspace Remote and the stage is recomposed (the engine
#     reports which layers it could not find);
#   · fallback = the crate parser and composer shipped with three >= 0.186, used
#     automatically when the WASM engine is unavailable.
#
# The host routes are exact Fetch routes on the shared /api channel:
# `GET /api/usd-preview/asset?uri=s3://…`, `GET /api/usd-preview/health`, and
# `GET|POST /api/usd-preview/update`. They are served only after the Connection
# browser-trust fence (Host/Origin) and the session credential admit the owner
# request; one signed read is bounded (64 MiB, 30 s, 413/502). A stage whose
# referenced layers live in S3-compatible object storage cannot be signed by the
# browser, so the host half signs those reads.
#
# The update route is the one route that can change the installation: on an
# explicit owner action it fast-forwards this plugin's own git checkout from its
# configured upstream and rebuilds `lib/` (see `src/host/update.js` and
# `scripts/update-local.mjs`, the terminal equivalent). It refuses a dirty or
# detached checkout, never resets or force-updates, and runs only fixed git/npm
# commands. A copy without `.git` reports "not a git checkout" and cannot update.
# The browser half hot-reloads after the rebuild; a `lib/index.js` change needs
# the host restart the update panel offers.
#
# S3 configuration is environment-only —
# DSH_USD_S3_ENDPOINT / DSH_USD_S3_ACCESS_KEY / DSH_USD_S3_SECRET_KEY, with
# optional DSH_USD_S3_BUCKET / DSH_USD_S3_REGION: no configuration file is read,
# no credential is copied or stored, and nothing on the server is modified.
#
# No realm / isolate is needed: this package publishes no service to the root
# realm and only consumes the existing documentPreviews / slots / locale / remote
# / connection services.
- insert:
    - id: ui-usd-3d-preview
      name: dsh-usd-3d-preview
